name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build rtc-components dependency
        run: |
          git clone --depth 1 https://github.com/communist-prometheus/rtc-components.git /tmp/rtc-components
          cd /tmp/rtc-components
          bun install
          bun run build

      - name: Install dependencies
        run: |
          bun install
          rm -rf node_modules/@rtc-less/rtc-components
          ln -s /tmp/rtc-components node_modules/@rtc-less/rtc-components

      - name: Type-check
        run: bunx astro check

      - name: Build
        run: bun run build
