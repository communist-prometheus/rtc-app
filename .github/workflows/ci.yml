name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build rtc-components dep
        run: |
          git clone --depth 1 https://github.com/communist-prometheus/rtc-components.git /tmp/rtc-components
          cd /tmp/rtc-components && bun install && bun run build

      - name: Install with workspace override
        run: |
          sed -i 's|"workspace:\*"|"file:/tmp/rtc-components"|' package.json
          bun install

      - run: bun run build
