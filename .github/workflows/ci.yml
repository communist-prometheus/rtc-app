name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Build, Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Build rtc-components dep
        run: |
          git clone --depth 1 https://github.com/communist-prometheus/rtc-components.git /tmp/rtc-components
          cd /tmp/rtc-components
          bun install
          bun run build

      - name: Install deps
        run: |
          bun install
          rm -rf node_modules/@rtc-less/rtc-components
          ln -s /tmp/rtc-components node_modules/@rtc-less/rtc-components

      - run: bun run build
